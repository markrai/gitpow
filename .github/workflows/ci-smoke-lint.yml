name: CI Smoke and Lint

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - maintainability-refactor

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-smoke-lint:
    name: Rust fmt and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check reviewed frontend globals
        run: node scripts/check-window-globals.mjs

      - name: Run smoke tests
        run: cargo test --test services_integration --test api_tauri_parity

  frontend-smoke:
    name: Frontend boot smoke
    runs-on: ubuntu-latest
    needs: rust-smoke-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build gitpow server
        run: cargo build --bin gitpow-rust

      - name: Install npm dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke tests
        run: npm run smoke:frontend
        env:
          REPOS_ROOT: ${{ github.workspace }}
          PORT: "3000"
          CI: "true"
